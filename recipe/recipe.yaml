context:
  version: "5.9.0"

package:
  name: certbot-dns-gehirn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-gehirn/certbot_dns_gehirn-${{ version }}.tar.gz
  sha256: 3fa077df1ee3bc78d19ff2fd13e7d677e4007bcc7d127c7a335adaf5a28ec2db

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dns-lexicon >=3.14.1

tests:
  - python:
      imports:
        - certbot_dns_gehirn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: Gehirn Infrastructure Service DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
